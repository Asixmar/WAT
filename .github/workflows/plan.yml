name: Aktualizuj plan WAT

on:
  # Odpala się, gdy iPhone wyśle nowy plan.html
  push:
    paths:
      - plan.html
  # Ręczne uruchomienie z zakładki Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - run: python wat_plan.py WCY24KC2S1 plan.ics plan.html

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan.ics
          if git diff --cached --quiet; then
            echo "Plan bez zmian."
          else
            git commit -m "Aktualizacja plan.ics"
            git push
          fi
